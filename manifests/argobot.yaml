#
# Complete, self-documenting Kubernetes deployment for argobot.
#
# Every environment variable argobot supports appears in the Deployment's env
# list below: those with a default are set to that default; those that must be
# absent by default are commented out (uncomment and set to opt in).
#
# The Deployment reads its credentials from a Secret named argobot-secrets via
# secretKeyRef. That Secret is deliberately NOT defined here: supply it out of
# band (your secret store / External Secrets, or `kubectl create secret generic
# argobot-secrets --from-literal=...`). Keeping credential material out of this
# manifest lets it float through GitOps without shipping or overwriting secrets.
# Expected key: CONFIGHUB_AUTH_PRIVATE_KEY (the service account's private JWK).
#
# CONFIGHUB_CHANNEL and CONFIGHUB_TARGET are ConfigHub placeholders: set them
# for the cluster before applying, as a ConfigHub variant of this base does.
#
# The image is the argobot release this manifest ships with. Each argobot image
# carries it as /manifests/argocd.yaml.
#
# argobot runs in its own `argobot` namespace; its RBAC to sync Argo CD
# Applications lives in the `argocd` namespace (assumed to already exist — this
# manifest does not create or manage it).
apiVersion: v1
kind: Namespace
metadata:
  name: argobot
  # argobot meets the Pod Security Standards restricted level.
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argobot
  namespace: argobot
---
# Argo CD: argobot patches an Application's argocd.argoproj.io/refresh
# annotation to force a sync, and lists and watches Applications to find the
# ones a Space deploys and to report their status. That is all it does in Argo
# CD's namespace, which also holds the credentials of every cluster and
# repository Argo CD deploys with, so the Role grants Applications alone. Its
# namespace must be ARGO_NAMESPACE's.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argobot-argocd
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argobot-argocd
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argobot-argocd
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: argobot
---
# Cluster facts: when CONFIGHUB_TARGET is set, argobot reads the Kubernetes
# version and the served resource types at startup, through discovery, which
# every authenticated identity may read, and lists CustomResourceDefinitions,
# StorageClasses and IngressClasses. Those are cluster-scoped, so this is a
# ClusterRole; it grants listing them and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argobot-read
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argobot-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argobot-read
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: argobot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argobot
  namespace: argobot
  labels:
    app: argobot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argobot
  template:
    metadata:
      labels:
        app: argobot
    spec:
      serviceAccountName: argobot
      # Meets the Pod Security Standards "restricted" level. The image runs as
      # 1000:3000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argobot
          image: ghcr.io/confighub/argobot:v0.2.9
          env:
            # ── ConfigHub connection (required) ──────────────────────────────
            - name: CONFIGHUB_URL
              value: "https://hub.confighub.com"
            # The service account key argobot authenticates with: a private
            # JWK, as `cub serviceaccount key add --generate` writes it.
            - name: CONFIGHUB_AUTH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: argobot-secrets
                  key: CONFIGHUB_AUTH_PRIVATE_KEY

            # ── Controller ───────────────────────────────────────────────────
            # "argocd" (default) drives Argo CD Applications. "sveltos" drives
            # Sveltos profiles and "flux" Flux OCIRepositories instead; each
            # needs different RBAC, so deploy manifests/sveltos/argobot.yaml or
            # manifests/flux/argobot.yaml for it.
            - name: GITOPS_CONTROLLER
              value: "argocd"

            # ── Argo CD sync ─────────────────────────────────────────────────
            # argobot patches the Application's refresh annotation via the
            # Kubernetes API (deploys only if auto-sync is enabled).
            # Namespace holding the Argo CD Application resources.
            - name: ARGO_NAMESPACE
              value: "argocd"
            # Refresh type: "hard" (re-resolve source, incl. OCI tag->digest) or
            # "normal".
            - name: ARGO_REFRESH_TYPE
              value: "hard"

            # ── Channel ──────────────────────────────────────────────────────
            # The ConfigHub Channel argobot claims and polls, as <space>/<slug>
            # or a UUID. Which events it delivers (and for which Spaces and
            # Targets) is the Channel's Subscriptions, set with cub, not here.
            - name: CONFIGHUB_CHANNEL
              value: confighubplaceholder

            # ── Cluster facts ────────────────────────────────────────────────
            # The ConfigHub Target that represents this cluster, as
            # <space>/<slug> or a UUID. When set, argobot collects facts about
            # the cluster (Kubernetes version, served resource types, storage
            # and ingress classes) at startup and stores them on the Target
            # under "Cluster.". Needs Edit on the Target. Empty stores none.
            - name: CONFIGHUB_TARGET
              value: confighubplaceholder

            # ── Application resolution ───────────────────────────────────────
            # Pin one Application for every event. Absent = resolve from the
            # event's Space slug (app-name == space-slug convention).
            # - name: ARGO_APP
            #   value: "my-app"

            # ── Live-status reporting ────────────────────────────────────────
            # argobot also watches Argo CD Applications and reports each one's
            # sync/health back to the ConfigHub Release it is running. On by
            # default; set to "false" to disable. Needs Kubernetes access (the
            # ServiceAccount above already grants it).
            # - name: CONFIGHUB_REPORT_LIVE_STATUS
            #   value: "false"

            # ── Metrics ──────────────────────────────────────────────────────
            # Address argobot serves Prometheus metrics on, at /metrics: sync
            # and live-status report counts by result. Defaults to ":9090". If
            # you change the port, change containerPort below to match. No
            # Service or scrape annotations are included; add your own.
            # "false" turns metrics off: argobot opens no port.
            - name: METRICS_ENABLED
              value: "true"
            # - name: METRICS_ADDR
            #   value: ":9090"
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
