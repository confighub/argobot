#
# Complete, self-documenting Kubernetes deployment for argobot.
#
# Every environment variable argobot supports appears in the Deployment's env
# list below: those with a default are set to that default; those that must be
# absent by default are commented out (uncomment and set to opt in).
#
# The Deployment reads its credentials from a Secret named argobot-secrets via
# secretKeyRef. That Secret is deliberately NOT defined here: supply it out of
# band (your secret store / External Secrets, or `kubectl create secret generic
# argobot-secrets --from-literal=...`). Keeping credential material out of this
# manifest lets it float through GitOps without shipping or overwriting secrets.
# Expected keys: CONFIGHUB_AUTH_PRIVATE_KEY (the service account's private JWK)
# and — only when ARGO_SYNC_MODE=argocd — ARGOCD_AUTH_TOKEN.
#
# argobot runs in its own `argobot` namespace; its RBAC to sync Argo CD
# Applications lives in the `argocd` namespace (assumed to already exist — this
# manifest does not create or manage it).
apiVersion: v1
kind: Namespace
metadata:
  name: argobot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argobot
  namespace: argobot
---
# argobot's control-plane namespace. In the default kubernetes sync mode it
# patches the Application's refresh annotation to force a sync, and it may manage
# other Argo CD resources here — so it gets read+write across the Argo CD
# namespace. This is a namespaced Role, so it grants nothing outside `argocd`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argobot-argocd
  namespace: argocd
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argobot-argocd
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argobot-argocd
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: argobot
---
# Cluster-wide read-only access for the upcoming health/status reporting:
# argobot will watch many resource kinds across all namespaces. Read across
# namespaces cannot be a Role (namespaced), so it is a ClusterRole bound
# cluster-wide. get/list/watch only — no write outside `argocd`.
#
# Secrets are deliberately excluded: argobot reports on resource health and
# never needs credential contents. RBAC has no "all except X", and Secrets live
# in the core ("") API group, so the core group is enumerated WITHOUT secrets,
# while every other group is wildcarded (no Secrets exist outside core). To
# cover a new CRD's API group, add it to the second rule's apiGroups list.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argobot-read
rules:
  # Core API group, minus Secrets.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - events
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - replicationcontrollers
      - resourcequotas
      - limitranges
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  # All other API groups: read everything (Secrets exist only in core, above).
  - apiGroups:
      - apps
      - batch
      - autoscaling
      - networking.k8s.io
      - policy
      - storage.k8s.io
      - discovery.k8s.io
      - apiextensions.k8s.io
      - argoproj.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argobot-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argobot-read
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: argobot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argobot
  namespace: argobot
  labels:
    app: argobot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argobot
  template:
    metadata:
      labels:
        app: argobot
    spec:
      serviceAccountName: argobot
      containers:
        - name: argobot
          image: ghcr.io/confighub/argobot:latest
          env:
            # ── ConfigHub connection (required) ──────────────────────────────
            - name: CONFIGHUB_URL
              value: "https://hub.confighub.com"
            # The service account key argobot authenticates with: a private
            # JWK, as `cub serviceaccount key add --generate` writes it.
            - name: CONFIGHUB_AUTH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: argobot-secrets
                  key: CONFIGHUB_AUTH_PRIVATE_KEY
            # Only for a server whose CONFIGHUB_ASSERTION_AUDIENCE is not the default.
            # - name: CONFIGHUB_ASSERTION_AUDIENCE
            #   value: ""

            # ── Controller ───────────────────────────────────────────────────
            # "argocd" (default) drives Argo CD Applications. "sveltos" drives
            # Sveltos profiles and "flux" Flux OCIRepositories instead; each
            # needs different RBAC, so deploy manifests/sveltos/argobot.yaml or
            # manifests/flux/argobot.yaml for it.
            - name: GITOPS_CONTROLLER
              value: "argocd"

            # ── Sync mode ────────────────────────────────────────────────────
            # "kubernetes" (default) patches the Application's refresh annotation
            # via the Kubernetes API (deploys only if auto-sync is enabled);
            # "argocd" calls the Argo CD REST API (deploys unconditionally).
            - name: ARGO_SYNC_MODE
              value: "kubernetes"

            # ── Kubernetes sync mode ─────────────────────────────────────────
            # Namespace holding the Argo CD Application resources.
            - name: ARGO_NAMESPACE
              value: "argocd"
            # Refresh type: "hard" (re-resolve source, incl. OCI tag->digest) or
            # "normal".
            - name: ARGO_REFRESH_TYPE
              value: "hard"

            # ── Argo CD REST sync mode (only when ARGO_SYNC_MODE=argocd) ──────
            # - name: ARGOCD_SERVER
            #   value: "https://argocd.example.com"
            # - name: ARGOCD_INSECURE
            #   value: "false"
            # - name: ARGOCD_AUTH_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: argobot-secrets
            #       key: ARGOCD_AUTH_TOKEN
            # Application namespace passed to the REST sync (apps-in-any-namespace).
            # - name: ARGO_APP_NAMESPACE
            #   value: ""
            # - name: ARGO_PRUNE
            #   value: "false"
            # - name: ARGO_FORCE
            #   value: "false"

            # ── Channel ──────────────────────────────────────────────────────
            # The ConfigHub Channel argobot claims and polls, as <space>/<slug>
            # or a UUID. Which events it delivers (and for which Spaces and
            # Targets) is the Channel's Subscriptions, set with cub, not here.
            - name: CONFIGHUB_CHANNEL
              value: "my-cluster/argobot"

            # ── Application resolution ───────────────────────────────────────
            # Pin one Application for every event. Absent = resolve from the
            # event's Space slug (app-name == space-slug convention).
            # - name: ARGO_APP
            #   value: "my-app"

            # ── Live-status reporting ────────────────────────────────────────
            # argobot also watches Argo CD Applications and reports each one's
            # sync/health back to the ConfigHub Release it is running. On by
            # default; set to "false" to disable. Needs Kubernetes access (the
            # ServiceAccount above already grants it).
            # - name: CONFIGHUB_REPORT_LIVE_STATUS
            #   value: "false"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
