#
# Cluster-wide read-only access for live-status reporting and cluster facts.
# get/list/watch only.
#
# Secrets are deliberately excluded: RBAC has no "all except X", and Secrets live
# in the core ("") API group, so the core group is enumerated without secrets,
# while every other group is wildcarded (no Secrets exist outside core). Each
# controller component adds its own API groups to the second rule.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argobot-read
rules:
  # Core API group, minus Secrets.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - events
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - replicationcontrollers
      - resourcequotas
      - limitranges
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  # All other API groups: read everything (Secrets exist only in core, above).
  - apiGroups:
      - apps
      - batch
      - autoscaling
      - networking.k8s.io
      - policy
      - storage.k8s.io
      - discovery.k8s.io
      - apiextensions.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argobot-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argobot-read
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: confighubplaceholder
