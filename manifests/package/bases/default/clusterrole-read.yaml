#
# Cluster facts: when CONFIGHUB_TARGET is set, argobot reads the Kubernetes
# version and the served resource types at startup, through discovery, which
# every authenticated identity may read, and lists CustomResourceDefinitions,
# StorageClasses and IngressClasses. Those are cluster-scoped, so this is a
# ClusterRole; it grants listing them and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argobot-read
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argobot-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argobot-read
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: confighubplaceholder
