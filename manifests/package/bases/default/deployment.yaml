#
# Its environment is the plain deployments' in manifests/, but for the
# controller's variables, which the controller component adds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argobot
  namespace: confighubplaceholder
  labels:
    app: argobot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argobot
  template:
    metadata:
      labels:
        app: argobot
    spec:
      serviceAccountName: argobot
      # Meets the Pod Security Standards "restricted" level. The image runs as
      # 1000:3000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argobot
          image: ghcr.io/confighub/argobot:v0.2.9
          env:
            # The ConfigHub server argobot connects to. The confighub_url input
            # sets it.
            - name: CONFIGHUB_URL
              value: "https://hub.confighub.com"
            # The service account key argobot authenticates with: a private
            # JWK, as `cub serviceaccount key add --generate` writes it. The
            # Secret is not part of the package: create it in the install
            # namespace yourself, or with your secret store.
            - name: CONFIGHUB_AUTH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: argobot-secrets
                  key: CONFIGHUB_AUTH_PRIVATE_KEY
            # The Channel argobot claims, as <space>/<slug>. The channel input
            # sets it; each variant of a base sets it for its cluster.
            - name: CONFIGHUB_CHANNEL
              value: confighubplaceholder
            # The Target argobot stores the cluster's facts on, as
            # <space>/<slug>. The target input sets it.
            - name: CONFIGHUB_TARGET
              value: confighubplaceholder
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
