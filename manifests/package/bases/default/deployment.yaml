#
# Its environment is the plain deployments' in manifests/, in the
# argobot-env ConfigMap but for the key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argobot
  namespace: confighubplaceholder
  labels:
    app: argobot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argobot
  template:
    metadata:
      labels:
        app: argobot
    spec:
      serviceAccountName: argobot
      # Meets the Pod Security Standards "restricted" level. The image runs as
      # 1000:3000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argobot
          image: ghcr.io/confighub/argobot:v0.2.8
          # Every variable but the key, from argobot.env and the controller
          # component's env file.
          envFrom:
            - configMapRef:
                name: argobot-env
          env:
            # The service account key argobot authenticates with: a private
            # JWK, as `cub serviceaccount key add --generate` writes it. The
            # Secret is not part of the package: create it in the install
            # namespace yourself, or with your secret store.
            - name: CONFIGHUB_AUTH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: argobot-secrets
                  key: CONFIGHUB_AUTH_PRIVATE_KEY
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
