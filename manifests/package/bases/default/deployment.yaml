#
# Its environment is the plain deployments' in manifests/, but for the
# controller's variables, which the controller component adds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argobot
  namespace: confighubplaceholder
  labels:
    app: argobot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argobot
  template:
    metadata:
      labels:
        app: argobot
      # Ask Prometheus to scrape the pod. Only a scrape config whose relabel
      # rules read prometheus.io/* honours them (the Prometheus Operator does
      # not). No prometheus.io/port: the target's port is then the metrics
      # containerPort, so the port is written in one place in this manifest.
      # The metrics input set to false removes them with that port.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: argobot
      # Meets the Pod Security Standards "restricted" level. The image runs as
      # 1000:3000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argobot
          image: ghcr.io/confighub/argobot:v0.2.9
          env:
            # The ConfigHub server argobot connects to. The confighub_url input
            # sets it.
            - name: CONFIGHUB_URL
              value: "https://hub.confighub.com"
            # The service account key argobot authenticates with: a private
            # JWK, as `cub serviceaccount key add --generate` writes it. The
            # Secret is not part of the package: create it in the install
            # namespace yourself, or with your secret store.
            - name: CONFIGHUB_AUTH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: argobot-secrets
                  key: CONFIGHUB_AUTH_PRIVATE_KEY
            # The Channel argobot claims, as <space>/<slug>. The channel input
            # sets it; each variant of a base sets it for its cluster.
            - name: CONFIGHUB_CHANNEL
              value: confighubplaceholder
            # The Target argobot stores the cluster's facts on, as
            # <space>/<slug>. The target input sets it.
            - name: CONFIGHUB_TARGET
              value: confighubplaceholder
            # Whether argobot serves metrics. The metrics input sets it.
            - name: METRICS_ENABLED
              value: "true"
          # Prometheus metrics at /metrics (METRICS_ADDR, by default :9090).
          # Setting METRICS_ADDR to another port needs containerPort changed too.
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
