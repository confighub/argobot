apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - clusterrole.yaml
  - healthcheck.yaml
# The variables argobot reads to drive Sveltos, merged into the base's.
configMapGenerator:
  - name: argobot-env
    namespace: confighubplaceholder
    behavior: merge
    envs:
      - sveltos.env
patches:
  # Read ClusterSummaries and HealthCheckReports, for live status.
  - target:
      kind: ClusterRole
      name: argobot-read
    patch: |-
      - op: add
        path: /rules/1/apiGroups/-
        value: config.projectsveltos.io
      - op: add
        path: /rules/1/apiGroups/-
        value: lib.projectsveltos.io
