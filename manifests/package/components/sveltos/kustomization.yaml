apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - clusterrole.yaml
  - healthcheck.yaml
# Drive Sveltos, as manifests/sveltos/argobot.yaml does, merged into the base's
# variables.
configMapGenerator:
  - name: argobot-env
    namespace: confighubplaceholder
    behavior: merge
    envs:
      - sveltos.env
