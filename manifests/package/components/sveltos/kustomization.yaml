apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - clusterrole.yaml
  - healthcheck.yaml
patches:
  # Drive Sveltos, as manifests/sveltos/argobot.yaml does.
  - target:
      kind: Deployment
      name: argobot
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argobot
      spec:
        template:
          spec:
            containers:
              - name: argobot
                env:
                  - name: GITOPS_CONTROLLER
                    value: sveltos
