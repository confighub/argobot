#
# Live status: Sveltos records no digest of what it fetched, so argobot reads the
# deployed objects themselves. This HealthCheck collects every object carrying
# confighub.com/origin (which names its Space, Unit and Revision) and judges its
# health; Sveltos writes the result as a HealthCheckReport per cluster.
#
# Coverage: it must select at least one object of every Unit, or argobot can't
# tell which revision of an unselected Unit is running and reports nothing for
# that Space. Add any other kind your Releases contain to resourceSelectors.
# Secrets are left out so their contents are never copied into reports.
#
# Size: collected objects are stored in full, and a Kubernetes object is capped
# at about 1.5 MiB; 100 ConfigMaps of about 4 KB each made a 693 KB report. For
# big Releases, select one small object per Unit rather than everything, or split
# the check.
#
# The Lua must return `status` for each resource, not `healthStatus` as the
# HealthCheckSpec API comment says; with healthStatus every report fails
# validation.
apiVersion: lib.projectsveltos.io/v1beta1
kind: HealthCheck
metadata:
  name: argobot-live-status
spec:
  collectResources: true
  resourceSelectors:
    - {group: "", version: v1, kind: Namespace}
    - {group: "", version: v1, kind: ConfigMap}
    - {group: "", version: v1, kind: Service}
    - {group: "", version: v1, kind: ServiceAccount}
    - {group: "", version: v1, kind: PersistentVolumeClaim}
    - {group: apps, version: v1, kind: Deployment}
    - {group: apps, version: v1, kind: StatefulSet}
    - {group: apps, version: v1, kind: DaemonSet}
    - {group: batch, version: v1, kind: Job}
    - {group: batch, version: v1, kind: CronJob}
    - {group: networking.k8s.io, version: v1, kind: Ingress}
    - {group: rbac.authorization.k8s.io, version: v1, kind: Role}
    - {group: rbac.authorization.k8s.io, version: v1, kind: RoleBinding}
    - {group: rbac.authorization.k8s.io, version: v1, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, version: v1, kind: ClusterRoleBinding}
    - {group: apiextensions.k8s.io, version: v1, kind: CustomResourceDefinition}
  evaluateHealth: |
    function evaluate()
      local hs = {}
      hs.resources = {}
      for _, r in ipairs(resources) do
        local ann = r.metadata.annotations
        if ann ~= nil and ann["confighub.com/origin"] ~= nil then
          local status = "Healthy"
          local msg = ""
          if r.kind == "Deployment" or r.kind == "StatefulSet" then
            local want = r.spec.replicas or 1
            local ready = (r.status and r.status.readyReplicas) or 0
            if ready < want then
              status = "Progressing"
              msg = "ready " .. ready .. "/" .. want
            end
          elseif r.kind == "DaemonSet" then
            local want = (r.status and r.status.desiredNumberScheduled) or 0
            local ready = (r.status and r.status.numberReady) or 0
            if ready < want then
              status = "Progressing"
              msg = "ready " .. ready .. "/" .. want
            end
          end
          table.insert(hs.resources, {resource = r, status = status, message = msg})
        end
      end
      return hs
    end
---
# Runs the HealthCheck on every cluster with a Sveltos agent. Sveltos requires a
# notification; a KubernetesEvent is the least intrusive.
apiVersion: lib.projectsveltos.io/v1beta1
kind: ClusterHealthCheck
metadata:
  name: argobot-live-status
spec:
  clusterSelector:
    matchLabels:
      sveltos-agent: present
  livenessChecks:
    - name: argobot-live-status
      type: HealthCheck
      livenessSourceRef:
        kind: HealthCheck
        apiVersion: lib.projectsveltos.io/v1beta1
        name: argobot-live-status
  notifications:
    - name: event
      type: KubernetesEvent
