#
# Flux: argobot patches the reconcile.fluxcd.io/requestedAt annotation on the
# OCIRepository that pulls a Space to force a sync, and lists and watches
# OCIRepositories and Kustomizations to find the ones a Space deploys and to
# report their status. They aren't confined to one namespace, so this is a
# ClusterRole; it grants nothing beyond those.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argobot-flux
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argobot-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argobot-flux
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: confighubplaceholder
