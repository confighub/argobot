apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - clusterrole.yaml
patches:
  # Drive Flux, as manifests/flux/argobot.yaml does.
  - target:
      kind: Deployment
      name: argobot
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argobot
      spec:
        template:
          spec:
            containers:
              - name: argobot
                env:
                  - name: GITOPS_CONTROLLER
                    value: flux
  # Read OCIRepositories and Kustomizations, for live status.
  - target:
      kind: ClusterRole
      name: argobot-read
    patch: |-
      - op: add
        path: /rules/1/apiGroups/-
        value: source.toolkit.fluxcd.io
      - op: add
        path: /rules/1/apiGroups/-
        value: kustomize.toolkit.fluxcd.io
