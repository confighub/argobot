apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - clusterrole.yaml
# Drive Flux, as manifests/flux/argobot.yaml does, merged into the base's
# variables.
configMapGenerator:
  - name: argobot-env
    namespace: confighubplaceholder
    behavior: merge
    envs:
      - flux.env
patches:
  # Read OCIRepositories and Kustomizations, for live status.
  - target:
      kind: ClusterRole
      name: argobot-read
    patch: |-
      - op: add
        path: /rules/1/apiGroups/-
        value: source.toolkit.fluxcd.io
      - op: add
        path: /rules/1/apiGroups/-
        value: kustomize.toolkit.fluxcd.io
