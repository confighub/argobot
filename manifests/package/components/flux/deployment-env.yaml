apiVersion: apps/v1
kind: Deployment
metadata:
  name: argobot
  namespace: confighubplaceholder
spec:
  template:
    spec:
      containers:
        - name: argobot
          env:
            - name: GITOPS_CONTROLLER
              value: flux
            # Where argobot looks for the OCIRepository named after a Space when
            # listing OCIRepositories fails.
            - name: FLUX_NAMESPACE
              value: flux-system
