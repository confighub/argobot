#
# Argo CD: argobot patches an Application's argocd.argoproj.io/refresh
# annotation to force a sync, and lists and watches Applications to find the
# ones a Space deploys and to report their status. That is all it does in Argo
# CD's namespace, which also holds the credentials of every cluster and
# repository Argo CD deploys with, so the Role grants Applications alone. Its
# namespace must be ARGO_NAMESPACE's.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argobot-argocd
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argobot-argocd
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argobot-argocd
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: confighubplaceholder
