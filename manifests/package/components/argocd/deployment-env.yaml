apiVersion: apps/v1
kind: Deployment
metadata:
  name: argobot
  namespace: confighubplaceholder
spec:
  template:
    spec:
      containers:
        - name: argobot
          env:
            - name: GITOPS_CONTROLLER
              value: argocd
            # The namespace holding the Argo CD Applications, where the Role
            # above is.
            - name: ARGO_NAMESPACE
              value: argocd
            # "hard" re-resolves the source, including an OCI tag's digest;
            # "normal" doesn't.
            - name: ARGO_REFRESH_TYPE
              value: hard
