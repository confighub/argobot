apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - role.yaml
# The variables argobot reads to drive Argo CD, merged into the base's.
configMapGenerator:
  - name: argobot-env
    namespace: confighubplaceholder
    behavior: merge
    envs:
      - argocd.env
patches:
  # Read Applications, for live status.
  - target:
      kind: ClusterRole
      name: argobot-read
    patch: |-
      - op: add
        path: /rules/1/apiGroups/-
        value: argoproj.io
