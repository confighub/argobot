apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - role.yaml
patches:
  - path: deployment-env.yaml
  # Read Applications, for live status.
  - target:
      kind: ClusterRole
      name: argobot-read
    patch: |-
      - op: add
        path: /rules/1/apiGroups/-
        value: argoproj.io
