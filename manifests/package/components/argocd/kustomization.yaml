apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - role.yaml
# The variables argobot reads to drive Argo CD, as manifests/argobot.yaml sets
# them, merged into the base's. ARGO_NAMESPACE must be the Role's namespace.
configMapGenerator:
  - name: argobot-env
    namespace: confighubplaceholder
    behavior: merge
    envs:
      - argocd.env
