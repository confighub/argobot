#
# Complete, self-documenting Kubernetes deployment for argobot driving Flux, the
# Flux variant of ../argobot.yaml. Install it on the cluster Flux runs on: that
# is where the OCIRepositories and Kustomizations live.
#
# Every environment variable argobot reads under Flux appears in the
# Deployment's env list below. The ARGO_* variables are Argo CD only and
# are ignored here.
#
# The Deployment reads its credentials from a Secret named argobot-secrets via
# secretKeyRef. That Secret is deliberately NOT defined here: supply it out of
# band (your secret store / External Secrets, or `kubectl create secret generic
# argobot-secrets --from-literal=...`). Expected key: CONFIGHUB_AUTH_PRIVATE_KEY
# (the service account's private JWK).
#
# argobot needs Flux 2.6 or later, which serves OCIRepository as
# source.toolkit.fluxcd.io/v1.
#
# CONFIGHUB_CHANNEL and CONFIGHUB_TARGET are ConfigHub placeholders: set them
# for the cluster before applying, as a ConfigHub variant of this base does.
#
# The image is the argobot release this manifest ships with. Each argobot image
# carries it as /manifests/flux.yaml.
#
# A Space is deployed by an OCIRepository pulling it from the ConfigHub OCI
# gateway, and a Kustomization applying it. For example:
#
#   apiVersion: source.toolkit.fluxcd.io/v1
#   kind: OCIRepository
#   metadata:
#     name: orders-prod             # named after the Space, by convention
#     namespace: flux-system
#   spec:
#     interval: 10m
#     url: oci://<gateway>/space/orders-prod
#     ref:
#       tag: latest                 # the gateway serves only latest or a digest
#     provider: generic
#     secretRef:
#       name: confighub-oci         # kubernetes.io/dockerconfigjson; username
#                                   # "token" and password a ConfigHub token
#     # insecure: true              # only for a plain-HTTP gateway
#   ---
#   apiVersion: kustomize.toolkit.fluxcd.io/v1
#   kind: Kustomization
#   metadata:
#     name: orders-prod
#     namespace: flux-system
#   spec:
#     interval: 10m
#     path: .
#     prune: true
#     wait: true                    # without it argobot reports health Unknown
#     timeout: 2m
#     sourceRef:
#       kind: OCIRepository
#       name: orders-prod
#
# No layerSelector is needed: a Release is a single tar+gzip layer, which Flux
# extracts by default.
apiVersion: v1
kind: Namespace
metadata:
  name: argobot
  # argobot meets the Pod Security Standards restricted level.
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argobot
  namespace: argobot
---
# Flux: argobot patches the reconcile.fluxcd.io/requestedAt annotation on the
# OCIRepository that pulls a Space to force a sync, and lists and watches
# OCIRepositories and Kustomizations to find the ones a Space deploys and to
# report their status. They aren't confined to one namespace, so this is a
# ClusterRole; it grants nothing beyond those.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argobot-flux
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argobot-flux
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argobot-flux
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: argobot
---
# Cluster facts: when CONFIGHUB_TARGET is set, argobot reads the Kubernetes
# version and the served resource types at startup, through discovery, which
# every authenticated identity may read, and lists CustomResourceDefinitions,
# StorageClasses and IngressClasses. Those are cluster-scoped, so this is a
# ClusterRole; it grants listing them and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argobot-read
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argobot-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argobot-read
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: argobot
---
# Cluster facts: on a cluster running the Amazon VPC CNI, whether it enforces
# NetworkPolicy is set in its amazon-vpc-cni ConfigMap, so argobot gets that
# one ConfigMap and no other. Without this grant, the
# Cluster.NetworkPolicyEnforcer fact is left out on such clusters; elsewhere
# the Role is unused.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argobot-read
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["amazon-vpc-cni"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argobot-read
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argobot-read
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: argobot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argobot
  namespace: argobot
  labels:
    app: argobot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argobot
  template:
    metadata:
      labels:
        app: argobot
    spec:
      serviceAccountName: argobot
      # Meets the Pod Security Standards "restricted" level. The image runs as
      # 1000:3000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argobot
          image: ghcr.io/confighub/argobot:v0.2.9
          env:
            # ── ConfigHub connection (required) ──────────────────────────────
            - name: CONFIGHUB_URL
              value: "https://hub.confighub.com"
            # The service account key argobot authenticates with: a private
            # JWK, as `cub serviceaccount key add --generate` writes it.
            - name: CONFIGHUB_AUTH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: argobot-secrets
                  key: CONFIGHUB_AUTH_PRIVATE_KEY

            # ── Controller ───────────────────────────────────────────────────
            # "flux" forces a reconciliation by patching the OCIRepository's
            # reconcile.fluxcd.io/requestedAt annotation, and reports live status
            # from the Kustomizations that apply it.
            - name: GITOPS_CONTROLLER
              value: "flux"
            # Where an OCIRepository is looked up when argobot falls back to the
            # one named after the Space (if listing OCIRepositories fails).
            # - name: FLUX_NAMESPACE
            #   value: "flux-system"

            # ── Channel ──────────────────────────────────────────────────────
            # The ConfigHub Channel argobot claims and polls, as <space>/<slug>
            # or a UUID. Which events it delivers (and for which Spaces and
            # Targets) is the Channel's Subscriptions, set with cub, not here.
            - name: CONFIGHUB_CHANNEL
              value: confighubplaceholder

            # ── Cluster facts ────────────────────────────────────────────────
            # The ConfigHub Target that represents this cluster, as
            # <space>/<slug> or a UUID. When set, argobot collects facts about
            # the cluster (Kubernetes version, served resource types, storage
            # and ingress classes) at startup and stores them on the Target
            # under "Cluster.". Needs Edit on the Target. Empty stores none.
            - name: CONFIGHUB_TARGET
              value: confighubplaceholder

            # ── Live-status reporting ────────────────────────────────────────
            # argobot watches Kustomizations and writes each Release's
            # sync/health back to ConfigHub as its LiveStatus. On by default; set
            # to "false" to disable.
            # - name: CONFIGHUB_REPORT_LIVE_STATUS
            #   value: "false"

            # ── Metrics ──────────────────────────────────────────────────────
            # Address argobot serves Prometheus metrics on, at /metrics: sync
            # and live-status report counts by result. Defaults to ":9090". If
            # you change the port, change containerPort below to match. No
            # Service or scrape annotations are included; add your own.
            # - name: METRICS_ADDR
            #   value: ":9090"
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
