#
# Complete, self-documenting Kubernetes deployment for argobot driving Sveltos,
# the Sveltos variant of ../argobot.yaml. Install it on the Sveltos management
# cluster: that is where ClusterProfiles, ClusterSummaries and HealthCheckReports
# live.
#
# Every environment variable argobot reads under Sveltos appears in the
# Deployment's env list below. The ARGO_* variables are Argo CD only and
# are ignored here.
#
# The Deployment reads its credentials from a Secret named argobot-secrets via
# secretKeyRef. That Secret is deliberately NOT defined here: supply it out of
# band (your secret store / External Secrets, or `kubectl create secret generic
# argobot-secrets --from-literal=...`). Expected key: CONFIGHUB_AUTH_PRIVATE_KEY
# (the service account's private JWK).
#
# CONFIGHUB_CHANNEL and CONFIGHUB_TARGET are ConfigHub placeholders: set them
# for the cluster before applying, as a ConfigHub variant of this base does.
#
# The image is the argobot release this manifest ships with. Each argobot image
# carries it as /manifests/sveltos.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: argobot
  # argobot meets the Pod Security Standards restricted level.
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argobot
  namespace: argobot
---
# Sveltos: argobot patches the profile.projectsveltos.io/redeploy annotation on
# the ClusterProfile (cluster-scoped) or Profile (namespaced) that deploys a
# Space to force a redeploy, and lists and watches ClusterSummaries and
# HealthCheckReports (a remote cluster's reports are collected into the
# management cluster) to report status. These aren't confined to one namespace,
# so this is a ClusterRole; it grants nothing beyond those.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argobot-sveltos
rules:
  - apiGroups: ["config.projectsveltos.io"]
    resources: ["clusterprofiles", "profiles"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["config.projectsveltos.io"]
    resources: ["clustersummaries"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["lib.projectsveltos.io"]
    resources: ["healthcheckreports"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argobot-sveltos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argobot-sveltos
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: argobot
---
# Cluster facts: when CONFIGHUB_TARGET is set, argobot reads the Kubernetes
# version and the served resource types at startup, through discovery, which
# every authenticated identity may read, and lists CustomResourceDefinitions,
# StorageClasses and IngressClasses. Those are cluster-scoped, so this is a
# ClusterRole; it grants listing them and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argobot-read
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argobot-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argobot-read
subjects:
  - kind: ServiceAccount
    name: argobot
    namespace: argobot
---
# Live status: Sveltos records no digest of what it fetched, so argobot reads the
# deployed objects themselves. This HealthCheck collects every object carrying
# confighub.com/origin (which names its Space, Unit and Revision) and judges its
# health; Sveltos writes the result as a HealthCheckReport per cluster.
#
# Coverage: it must select at least one object of every Unit, or argobot can't
# tell which revision of an unselected Unit is running and reports nothing for
# that Space. Add any other kind your Releases contain to resourceSelectors.
# Secrets are left out so their contents are never copied into reports.
#
# Size: collected objects are stored in full, and a Kubernetes object is capped
# at about 1.5 MiB; 100 ConfigMaps of about 4 KB each made a 693 KB report. For
# big Releases, select one small object per Unit rather than everything, or split
# the check.
#
# The Lua must return `status` for each resource, not `healthStatus` as the
# HealthCheckSpec API comment says; with healthStatus every report fails
# validation.
apiVersion: lib.projectsveltos.io/v1beta1
kind: HealthCheck
metadata:
  name: argobot-live-status
spec:
  collectResources: true
  resourceSelectors:
    - {group: "", version: v1, kind: Namespace}
    - {group: "", version: v1, kind: ConfigMap}
    - {group: "", version: v1, kind: Service}
    - {group: "", version: v1, kind: ServiceAccount}
    - {group: "", version: v1, kind: PersistentVolumeClaim}
    - {group: apps, version: v1, kind: Deployment}
    - {group: apps, version: v1, kind: StatefulSet}
    - {group: apps, version: v1, kind: DaemonSet}
    - {group: batch, version: v1, kind: Job}
    - {group: batch, version: v1, kind: CronJob}
    - {group: networking.k8s.io, version: v1, kind: Ingress}
    - {group: rbac.authorization.k8s.io, version: v1, kind: Role}
    - {group: rbac.authorization.k8s.io, version: v1, kind: RoleBinding}
    - {group: rbac.authorization.k8s.io, version: v1, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, version: v1, kind: ClusterRoleBinding}
    - {group: apiextensions.k8s.io, version: v1, kind: CustomResourceDefinition}
  evaluateHealth: |
    function evaluate()
      local hs = {}
      hs.resources = {}
      for _, r in ipairs(resources) do
        local ann = r.metadata.annotations
        if ann ~= nil and ann["confighub.com/origin"] ~= nil then
          local status = "Healthy"
          local msg = ""
          if r.kind == "Deployment" or r.kind == "StatefulSet" then
            local want = r.spec.replicas or 1
            local ready = (r.status and r.status.readyReplicas) or 0
            if ready < want then
              status = "Progressing"
              msg = "ready " .. ready .. "/" .. want
            end
          elseif r.kind == "DaemonSet" then
            local want = (r.status and r.status.desiredNumberScheduled) or 0
            local ready = (r.status and r.status.numberReady) or 0
            if ready < want then
              status = "Progressing"
              msg = "ready " .. ready .. "/" .. want
            end
          end
          table.insert(hs.resources, {resource = r, status = status, message = msg})
        end
      end
      return hs
    end
---
# Runs the HealthCheck on every cluster with a Sveltos agent. Sveltos requires a
# notification; a KubernetesEvent is the least intrusive.
apiVersion: lib.projectsveltos.io/v1beta1
kind: ClusterHealthCheck
metadata:
  name: argobot-live-status
spec:
  clusterSelector:
    matchLabels:
      sveltos-agent: present
  livenessChecks:
    - name: argobot-live-status
      type: HealthCheck
      livenessSourceRef:
        kind: HealthCheck
        apiVersion: lib.projectsveltos.io/v1beta1
        name: argobot-live-status
  notifications:
    - name: event
      type: KubernetesEvent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argobot
  namespace: argobot
  labels:
    app: argobot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argobot
  template:
    metadata:
      labels:
        app: argobot
    spec:
      serviceAccountName: argobot
      # Meets the Pod Security Standards "restricted" level. The image runs as
      # 1000:3000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argobot
          image: ghcr.io/confighub/argobot:v0.2.9
          env:
            # ── ConfigHub connection (required) ──────────────────────────────
            - name: CONFIGHUB_URL
              value: "https://hub.confighub.com"
            # The service account key argobot authenticates with: a private
            # JWK, as `cub serviceaccount key add --generate` writes it.
            - name: CONFIGHUB_AUTH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: argobot-secrets
                  key: CONFIGHUB_AUTH_PRIVATE_KEY

            # ── Controller ───────────────────────────────────────────────────
            # "sveltos" forces a redeploy by patching the profile's
            # profile.projectsveltos.io/redeploy annotation, and reports live
            # status from HealthCheckReports.
            - name: GITOPS_CONTROLLER
              value: "sveltos"

            # ── Channel ──────────────────────────────────────────────────────
            # The ConfigHub Channel argobot claims and polls, as <space>/<slug>
            # or a UUID. Which events it delivers (and for which Spaces and
            # Targets) is the Channel's Subscriptions, set with cub, not here.
            - name: CONFIGHUB_CHANNEL
              value: confighubplaceholder

            # ── Cluster facts ────────────────────────────────────────────────
            # The ConfigHub Target that represents this cluster, as
            # <space>/<slug> or a UUID. When set, argobot collects facts about
            # the cluster (Kubernetes version, served resource types, storage
            # and ingress classes) at startup and stores them on the Target
            # under "Cluster.". Needs Edit on the Target. Empty stores none.
            - name: CONFIGHUB_TARGET
              value: confighubplaceholder

            # ── Live-status reporting ────────────────────────────────────────
            # argobot watches the HealthCheckReports the HealthCheck above
            # produces and writes each Release's sync/health back to ConfigHub as
            # its LiveStatus. On by default; set to "false" to disable.
            # - name: CONFIGHUB_REPORT_LIVE_STATUS
            #   value: "false"

            # ── Metrics ──────────────────────────────────────────────────────
            # Address argobot serves Prometheus metrics on, at /metrics: sync
            # and live-status report counts by result. Defaults to ":9090". If
            # you change the port, change containerPort below to match. No
            # Service or scrape annotations are included; add your own.
            # - name: METRICS_ADDR
            #   value: ":9090"
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
