name: release

# The container image is versioned with semver and is cut ONLY when you push a
# git tag vX.Y.Z. It is immutable per version.
#
# argobot's Kubernetes deployments are built into the binary rather than
# published separately: `argobot install --controller argo|flux|sveltos` prints
# the one for a controller, pinned to the image of the same version. The build
# stamps that version from the git tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/confighub/argobot

jobs:
  # Build and push the semver image. Tag events only.
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # {{raw}} keeps the leading v, so the image tag equals the git tag
          # equals the version stamped into the binary — no v-prefix mismatch.
          tags: |
            type=semver,pattern={{raw}}
            type=sha
          flavor: |
            latest=true

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Both architectures. arm64 alone made the image unusable on every
          # amd64 cluster — containerd rejects the pull with "no match for
          # platform in manifest", which is what `cub cluster up` hits on a
          # GitHub runner and on any amd64 node. The Dockerfile already
          # cross-compiles from BUILDPLATFORM, so amd64 is nearly free here:
          # it is the runner's native arch and needs no emulation at all.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The version `argobot install` pins the image to.
          build-args: |
            VERSION=${{ github.ref_name }}
          # Attach an SPDX SBOM and provenance to the image manifest. Together with
          # the notice files copied into the image, this is the per-release
          # inventory of what the image contains:
          #   docker buildx imagetools inspect $IMAGE:<tag> --format '{{json .SBOM}}'
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pin the installer package to the image just released, as a pull request:
  # the package names a tag, never latest, so a release reaches it only
  # through a change to it. Merging that change publishes the package
  # (package.yml). Opening the pull request needs "Allow GitHub Actions to
  # create and approve pull requests" in the repository's Actions settings, and
  # a pull request opened with GITHUB_TOKEN starts no workflows of its own.
  package:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Open a pull request pinning the package to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PACKAGE_DIR: manifests/package
        run: |
          set -euo pipefail
          # sed rather than yq, so the files keep their comments and quoting.
          sed -i "s#^\(    newTag: \).*#\1${TAG}#" "${PACKAGE_DIR}/bases/default/kustomization.yaml"
          sed -i "s#^\(          image: ${IMAGE}:\).*#\1${TAG}#" "${PACKAGE_DIR}/bases/default/deployment.yaml"
          if git diff --quiet; then
            echo "The package already runs ${TAG}."
            exit 0
          fi
          version=$(yq -r .installerMetadata.version "${PACKAGE_DIR}/installer.yaml")
          next=$(echo "$version" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
          sed -i "s#^\(  version: \)${version}\$#\1${next}#" "${PACKAGE_DIR}/installer.yaml"
          git diff --stat

          branch="package-argobot-${TAG}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "Run argobot ${TAG} in installer package ${next}"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Run argobot ${TAG} in installer package ${next}" \
            --body "Pins the installer package's image to \`${IMAGE}:${TAG}\`, which the ${TAG} release just pushed, and bumps the package to ${next}. Merging publishes it."
