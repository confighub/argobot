name: release

# The container image is versioned with semver and is cut ONLY when you push a
# git tag vX.Y.Z. It is immutable per version.
#
# The image carries argobot's Kubernetes deployments, one per controller, in
# /manifests, and each names the image it ships in. So the version is set
# before the tag: scripts/set-version.sh vX.Y.Z, merged, then the tag. A tag the
# deployments don't name fails here, before anything is pushed. After the image,
# the installer package, which names the same release, is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/confighub/argobot

jobs:
  # Build and push the semver image. Tag events only.
  image:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check that the deployments name this release
        run: scripts/set-version.sh --check "${{ github.ref_name }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # {{raw}} keeps the leading v, so the image tag equals the git tag
          # equals the tag the deployments name — no v-prefix mismatch.
          tags: |
            type=semver,pattern={{raw}}
            type=sha
          flavor: |
            latest=true

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Both architectures. arm64 alone made the image unusable on every
          # amd64 cluster — containerd rejects the pull with "no match for
          # platform in manifest", which is what `cub cluster up` hits on a
          # GitHub runner and on any amd64 node. The Dockerfile already
          # cross-compiles from BUILDPLATFORM, so amd64 is nearly free here:
          # it is the runner's native arch and needs no emulation at all.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attach an SPDX SBOM and provenance to the image manifest. Together with
          # the notice files copied into the image, this is the per-release
          # inventory of what the image contains:
          #   docker buildx imagetools inspect $IMAGE:<tag> --format '{{json .SBOM}}'
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish the installer package, which runs the image just pushed, as
  # oci://ghcr.io/confighub/packages/argobot:<version>, signed keylessly. Its
  # version is the release's without the "v", and is published once.
  package:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # Keyless signing.
      id-token: write
    env:
      PACKAGE_DIR: manifests/package
      PACKAGE_REPO: ghcr.io/confighub/packages/argobot
      INSTALLER_VERSION: v0.3.0
    steps:
      - uses: actions/checkout@v7

      # test-package.sh compares the package's env schema with docgen env.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install the installer
        run: |
          set -euo pipefail
          base="https://github.com/confighub/installer/releases/download/${INSTALLER_VERSION}"
          curl -fsSLO "${base}/installer-linux-amd64"
          curl -fsSLO "${base}/installer-linux-amd64.sha256"
          sha256sum -c installer-linux-amd64.sha256
          install -m 0755 installer-linux-amd64 /usr/local/bin/installer
          rm installer-linux-amd64 installer-linux-amd64.sha256

      - name: Test the package
        run: scripts/test-package.sh

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | installer login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version=$(yq -r .installerMetadata.version "${PACKAGE_DIR}/installer.yaml")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          installer package "$PACKAGE_DIR" -o "${RUNNER_TEMP}/argobot.tgz"

      - name: Check whether the version is published
        id: published
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if installer list "oci://${PACKAGE_REPO}" 2>/dev/null | grep -qx "$VERSION"; then
            echo "::notice::Package ${VERSION} is already published."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: steps.published.outputs.exists == 'false'
        uses: sigstore/cosign-installer@v3

      - name: Push and sign
        if: steps.published.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          installer push "${RUNNER_TEMP}/argobot.tgz" "oci://${PACKAGE_REPO}:${VERSION}"
          installer sign "oci://${PACKAGE_REPO}:${VERSION}" --yes
