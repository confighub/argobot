name: publish-config-bundle

# Packages the manifests into a plain OCI manifest bundle and pushes it to
# ghcr.io/<owner>/configs/argobot. The bundle is a standard OCI image artifact
# with a single tar+gzip layer of literal Kubernetes YAML — the shape a GitOps
# operator (Argo CD, Flux OCIRepository) consumes.
#
# Install the bundle into ConfigHub as a component base:
#   cub variant upload --component argobot --variant base --granularity per-file \
#     oci://ghcr.io/confighub/configs/argobot

on:
  push:
    branches: [main]
    paths: ['manifests/**']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/configs

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install oras
        uses: oras-project/setup-oras@v2

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            oras login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build bundle contents
        run: |
          mkdir -p out/argobot
          cp manifests/*.yaml out/argobot/

      - name: Package and push bundle
        run: |
          # Reproducible tarball: fixed entry order, ownership, and mtime, and
          # gzip -n (no embedded name/timestamp), so identical content yields an
          # identical layer digest run to run.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime='UTC 1970-01-01' -cf - -C out/argobot . | gzip -n > argobot.tar.gz
          oras push \
            "$REGISTRY/argobot:latest" \
            --artifact-type application/vnd.confighub.config.bundle.v1 \
            "argobot.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip"
          echo "Pushed $REGISTRY/argobot:latest"
