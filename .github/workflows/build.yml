name: build

# Development image builds for branches and PRs. Tagged releases (semver image +
# config bundle) are handled by release.yml, so this workflow does not run on
# tags and never produces a semver or :latest image.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/confighub/argobot

jobs:
  build:
    # GitHub-hosted amd64 runner. The Go binary is cross-compiled natively on it
    # for arm64 (see Dockerfile); QEMU is only registered so buildx can assemble
    # the arm64 image layers, never to run an emulated compile. We build arm64
    # only — the target nodes are all arm64, so amd64 would be wasted work.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
