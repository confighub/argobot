name: package

# Tests argobot's installer package (manifests/package) and publishes it as
# oci://ghcr.io/confighub/packages/argobot:<installerMetadata.version>, signed
# keylessly. The package's version is the argobot release it runs, so each
# version is published once, when release.yml's pull request pinning the
# package to that release merges.
on:
  push:
    branches: [main]
    paths:
      - manifests/package/**
      - scripts/test-package.sh
      - .github/workflows/package.yml
      # The environment the package's schema is generated from.
      - config.go
      - docgen.go
  pull_request:
    paths:
      - manifests/package/**
      - scripts/test-package.sh
      - .github/workflows/package.yml
      # The environment the package's schema is generated from.
      - config.go
      - docgen.go
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  # Keyless signing.
  id-token: write

env:
  PACKAGE_DIR: manifests/package
  PACKAGE_REPO: ghcr.io/confighub/packages/argobot
  INSTALLER_VERSION: v0.2.0

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # test-package.sh compares the package's env schema with docgen env.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install the installer
        run: |
          set -euo pipefail
          base="https://github.com/confighub/installer/releases/download/${INSTALLER_VERSION}"
          curl -fsSLO "${base}/installer-linux-amd64"
          curl -fsSLO "${base}/installer-linux-amd64.sha256"
          sha256sum -c installer-linux-amd64.sha256
          install -m 0755 installer-linux-amd64 /usr/local/bin/installer
          rm installer-linux-amd64 installer-linux-amd64.sha256

      # Renders the package for each controller and preset with this
      # installer, running its validators, and checks the renders it refuses.
      # Run it locally the same way.
      - name: Test the package
        run: scripts/test-package.sh

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | installer login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version=$(yq -r .installerMetadata.version "${PACKAGE_DIR}/installer.yaml")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          installer package "$PACKAGE_DIR" -o "${RUNNER_TEMP}/argobot.tgz" | tee "${RUNNER_TEMP}/package.out"
          echo "digest=$(awk '/digest:/ {print $2}' "${RUNNER_TEMP}/package.out")" >> "$GITHUB_OUTPUT"

      # A version is published once. A change to the package after its version
      # is published ships with the next argobot release, which release.yml
      # pins the package to.
      - name: Check whether the version is published
        id: published
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if installer list "oci://${PACKAGE_REPO}" 2>/dev/null | grep -qx "$VERSION"; then
            echo "::notice::Package ${VERSION} is already published; changes to it ship with the next argobot release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Package ${VERSION} is not published yet."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: github.event_name != 'pull_request' && steps.published.outputs.exists == 'false'
        uses: sigstore/cosign-installer@v3

      - name: Push and sign
        if: github.event_name != 'pull_request' && steps.published.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          installer push "${RUNNER_TEMP}/argobot.tgz" "oci://${PACKAGE_REPO}:${VERSION}"
          installer sign "oci://${PACKAGE_REPO}:${VERSION}" --yes
