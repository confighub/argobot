name: package

# Publishes argobot's installer package (manifests/package) as
# oci://ghcr.io/confighub/packages/argobot:<installerMetadata.version>, signed
# keylessly. A version is immutable: a change to the package that leaves the
# version where it is fails, here and on the pull request that makes it.
on:
  push:
    branches: [main]
    paths:
      - manifests/package/**
      - .github/workflows/package.yml
  pull_request:
    paths:
      - manifests/package/**
      - .github/workflows/package.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  # Keyless signing.
  id-token: write

env:
  PACKAGE_DIR: manifests/package
  PACKAGE_REPO: ghcr.io/confighub/packages/argobot
  INSTALLER_VERSION: v0.2.0

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install the installer
        run: |
          set -euo pipefail
          base="https://github.com/confighub/installer/releases/download/${INSTALLER_VERSION}"
          curl -fsSLO "${base}/installer-linux-amd64"
          curl -fsSLO "${base}/installer-linux-amd64.sha256"
          sha256sum -c installer-linux-amd64.sha256
          install -m 0755 installer-linux-amd64 /usr/local/bin/installer
          rm installer-linux-amd64 installer-linux-amd64.sha256

      # The installer runs kustomize over the base and the selected component.
      # A placeholder stands in for the key the collector writes at install
      # time.
      - name: Build each controller's kustomization
        run: |
          set -euo pipefail
          echo '{}' > "${PACKAGE_DIR}/bases/default/argobot-private-key.env.secret"
          for component in argocd flux sveltos; do
            dir="${PACKAGE_DIR}/.build-${component}"
            mkdir -p "$dir"
            printf 'apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources: [../bases/default]\ncomponents: [../components/%s]\n' \
              "$component" > "${dir}/kustomization.yaml"
            kustomize build "$dir" > /dev/null
            echo "built ${component}"
            rm -r "$dir"
          done
          rm "${PACKAGE_DIR}/bases/default/argobot-private-key.env.secret"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | installer login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version=$(yq -r .installerMetadata.version "${PACKAGE_DIR}/installer.yaml")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          installer package "$PACKAGE_DIR" -o "${RUNNER_TEMP}/argobot.tgz" | tee "${RUNNER_TEMP}/package.out"
          echo "digest=$(awk '/digest:/ {print $2}' "${RUNNER_TEMP}/package.out")" >> "$GITHUB_OUTPUT"

      # Packaging is deterministic, so a published version repackages to the
      # same digest exactly when its contents are unchanged.
      - name: Compare with the published version
        id: published
        env:
          VERSION: ${{ steps.package.outputs.version }}
          DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          set -euo pipefail
          if ! installer list "oci://${PACKAGE_REPO}" 2>/dev/null | grep -qx "$VERSION"; then
            echo "Version ${VERSION} is not published yet."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          installer pull "oci://${PACKAGE_REPO}:${VERSION}" --work-dir "${RUNNER_TEMP}/published"
          published=$(installer package "${RUNNER_TEMP}/published/package" -o "${RUNNER_TEMP}/published.tgz" | awk '/digest:/ {print $2}')
          if [ "$published" != "$DIGEST" ]; then
            echo "::error file=${PACKAGE_DIR}/installer.yaml::Version ${VERSION} is already published with other contents. Bump installerMetadata.version."
            exit 1
          fi
          echo "Version ${VERSION} is published with these contents."
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request' && steps.published.outputs.exists == 'false'
        uses: sigstore/cosign-installer@v3

      - name: Push and sign
        if: github.event_name != 'pull_request' && steps.published.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          installer push "${RUNNER_TEMP}/argobot.tgz" "oci://${PACKAGE_REPO}:${VERSION}"
          installer sign "oci://${PACKAGE_REPO}:${VERSION}" --yes
